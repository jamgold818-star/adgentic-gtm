<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adgentic — GTM Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #222632;
    --border: #2a2e3a;
    --text: #e4e4e7;
    --text-muted: #8b8d97;
    --accent: #6366f1;
    --accent-light: #818cf8;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --cyan: #22d3ee;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .header h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .header h1 span { color: var(--accent-light); }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .status-dot {
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .refresh-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }

  .refresh-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .filters {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .filter-group {
    position: relative;
  }

  .filter-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 7px 28px 7px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-toggle::after {
    content: '\25BE';
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
  }

  .filter-toggle:hover { background: var(--surface-hover); color: var(--text); }

  .filter-toggle.has-selection {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .filter-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 0;
    z-index: 100;
    min-width: 180px;
    max-height: 260px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .filter-dropdown.open { display: block; }

  .filter-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    transition: background 0.15s;
  }

  .filter-option:hover { background: var(--surface-hover); }

  .filter-option input[type="checkbox"] {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
    cursor: pointer;
  }

  .filter-clear {
    background: none;
    border: none;
    color: var(--accent-light);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 14px;
    width: 100%;
    text-align: left;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  .filter-clear:hover { text-decoration: underline; }

  .section-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    padding-top: 8px;
    letter-spacing: -0.3px;
  }

  .section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 8px 0 24px;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: border-color 0.2s;
  }

  .kpi-card:hover { border-color: var(--accent); }

  .kpi-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .kpi-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -1px;
  }

  .kpi-value.green { color: var(--green); }
  .kpi-value.amber { color: var(--amber); }
  .kpi-value.red { color: var(--red); }
  .kpi-value.cyan { color: var(--cyan); }

  .kpi-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .chart-card h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text-muted);
  }

  .chart-container {
    position: relative;
    height: 280px;
  }

  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 32px;
  }

  .table-card h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 20px 24px 16px;
  }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    padding: 10px 16px;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tr:hover td { background: var(--surface-hover); }

  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }

  .tag-salesco { background: rgba(99,102,241,0.15); color: var(--accent-light); }
  .tag-saleshive { background: rgba(52,211,153,0.15); color: var(--green); }
  .tag-internal { background: rgba(251,191,36,0.15); color: var(--amber); }
  .tag-warm { background: rgba(251,146,60,0.15); color: #fb923c; }

  .outcome-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }

  .outcome-won { background: rgba(52,211,153,0.15); color: var(--green); }
  .outcome-positive { background: rgba(99,102,241,0.15); color: var(--accent-light); }
  .outcome-negative { background: rgba(251,146,60,0.15); color: #fb923c; }
  .outcome-noshow { background: rgba(248,113,113,0.15); color: var(--red); }
  .outcome-pending { background: rgba(139,141,151,0.15); color: var(--text-muted); }

  .bar-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .mini-bar {
    height: 6px;
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.5s ease;
  }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 400px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .loading::after {
    content: '';
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 10px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 20px 0;
  }

  @media (max-width: 600px) {
    body { padding: 16px; }
    .charts-grid { grid-template-columns: 1fr; }
    .kpi-value { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>Adgentic</span> GTM Dashboard</h1>
  <div class="header-meta">
    <span><span class="status-dot"></span>Live from Apollo.io</span>
    <span id="last-updated"></span>
    <button class="refresh-btn" onclick="loadData()">Refresh</button>
  </div>
</div>

<div class="filters" id="filters"></div>

<div id="content">
  <div class="loading">Loading dashboard data</div>
</div>

<div class="footer">
  Adgentic GTM Dashboard &middot; Data synced from Apollo.io
</div>

<script>
const SHEET_ID = '14NGi2PDaSkIJrnqNv40rV-nQtbGfJu8LNWp7be0N4r4';
const BASE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

let campaignData = [];
let meetingData = [];
let clientData = [];
let filters = { motion: [], masterIcp: [], spearTip: [], channel: [] };
let charts = {};

async function fetchSheet(sheetName) {
  const url = sheetName ? `${BASE_URL}&sheet=${encodeURIComponent(sheetName)}` : BASE_URL;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Sheet "${sheetName}" returned ${res.status}`);
  const csv = await res.text();
  return parseCSV(csv);
}

async function loadData() {
  try {
    // Fetch all three sheets, but don't let one failure break everything
    const results = await Promise.allSettled([
      fetchSheet('GTM Campaigns'),
      fetchSheet('Booked Meetings'),
      fetchSheet('Client Tracker')
    ]);

    campaignData = results[0].status === 'fulfilled' ? results[0].value : [];
    meetingData = results[1].status === 'fulfilled' ? results[1].value : [];
    clientData = results[2].status === 'fulfilled' ? results[2].value : [];

    // If campaigns failed, try fetching without sheet name (first tab fallback)
    if (campaignData.length === 0) {
      try {
        campaignData = await fetchSheet(null);
      } catch(e2) {}
    }

    if (campaignData.length === 0 && meetingData.length === 0 && clientData.length === 0) {
      throw new Error('All sheets returned empty');
    }

    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    buildFilters();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="loading" style="flex-direction:column;gap:12px;">
        <span style="font-size:16px;font-weight:600;">Unable to load data</span>
        <span>Unable to connect to the data source. Please try again later.</span>
        <span style="font-size:11px;color:#555;">${e.message || ''}</span>
      </div>`;
  }
}

function parseCSV(csv) {
  const lines = csv.trim().split('\n');
  const headers = parseLine(lines[0]);
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const vals = parseLine(line);
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (vals[i] || '').trim());
    return obj;
  });
}

function parseLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += ch;
    }
  }
  result.push(current);
  return result;
}

function buildFilters() {
  const defs = [
    { key: 'motion', label: 'GTM Motion', values: [...new Set(campaignData.map(d => d['GTM Motion']).concat(meetingData.map(d => d['GTM Source'])))] },
    { key: 'masterIcp', label: 'Master ICP', values: [...new Set(campaignData.map(d => d['Master ICP']))] },
    { key: 'spearTip', label: 'Spear Tip', values: [...new Set(campaignData.map(d => d['Spear Tip']))] },
    { key: 'channel', label: 'Last Touch', values: [...new Set(meetingData.map(d => d['Demo Attribution']))] }
  ];
  const container = document.getElementById('filters');
  container.innerHTML = defs.map(def => {
    const vals = def.values.filter(Boolean).sort();
    const sel = filters[def.key];
    const hasSelection = sel.length > 0;
    const count = hasSelection ? ` (${sel.length})` : '';
    return `<div class="filter-group">
      <button class="filter-toggle ${hasSelection ? 'has-selection' : ''}" onclick="toggleDropdown('${def.key}')">${def.label}${count}</button>
      <div class="filter-dropdown" id="dropdown-${def.key}">
        ${vals.map(v => `<label class="filter-option">
          <input type="checkbox" ${sel.includes(v) ? 'checked' : ''} onchange="toggleFilter('${def.key}', '${v.replace(/'/g, "\\'")}')"> ${v}
        </label>`).join('')}
        ${hasSelection ? `<button class="filter-clear" onclick="clearFilter('${def.key}')">Clear</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function toggleDropdown(key) {
  document.querySelectorAll('.filter-dropdown').forEach(d => {
    if (d.id !== 'dropdown-' + key) d.classList.remove('open');
  });
  document.getElementById('dropdown-' + key).classList.toggle('open');
}

function toggleFilter(key, value) {
  const idx = filters[key].indexOf(value);
  if (idx >= 0) filters[key].splice(idx, 1);
  else filters[key].push(value);
  buildFilters();
  render();
}

function clearFilter(key) {
  filters[key] = [];
  buildFilters();
  render();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.filter-group')) {
    document.querySelectorAll('.filter-dropdown').forEach(d => d.classList.remove('open'));
  }
});

function filteredCampaigns() {
  return campaignData.filter(d => {
    if (filters.motion.length && !filters.motion.includes(d['GTM Motion'])) return false;
    if (filters.masterIcp.length && !filters.masterIcp.includes(d['Master ICP'])) return false;
    if (filters.spearTip.length && !filters.spearTip.includes(d['Spear Tip'])) return false;
    return true;
  });
}

function filteredMeetings() {
  let result = meetingData;
  if (filters.motion.length) result = result.filter(d => filters.motion.includes(d['GTM Source']));
  if (filters.channel.length) result = result.filter(d => filters.channel.includes(d['Demo Attribution']));
  return result;
}

function num(str) {
  return parseInt(String(str).replace(/[^0-9]/g, ''), 10) || 0;
}

function pct(str) {
  const n = parseFloat(String(str).replace('%', ''));
  return isNaN(n) ? 0 : n;
}

function money(str) {
  return parseInt(String(str).replace(/[^0-9]/g, ''), 10) || 0;
}

function motionTagClass(motion) {
  if (motion.includes('Sales.co')) return 'tag-salesco';
  if (motion.includes('SalesHive')) return 'tag-saleshive';
  if (motion.includes('Warm')) return 'tag-warm';
  return 'tag-internal';
}

function campaignBookingsByChannel(motion) {
  const matched = meetingData.filter(d => d['GTM Source'] === motion);
  return {
    call: matched.filter(d => d['Demo Attribution'] === 'Cold Call').length,
    email: matched.filter(d => d['Demo Attribution'] === 'Cold Email').length,
    linkedin: matched.filter(d => d['Demo Attribution'] === 'LinkedIn').length
  };
}

function outcomeTag(outcome) {
  if (!outcome) return '<span class="outcome-tag outcome-pending">Pending</span>';
  if (outcome === 'Closed Won') return '<span class="outcome-tag outcome-won">Closed Won</span>';
  if (outcome.startsWith('Positive')) return `<span class="outcome-tag outcome-positive">${outcome}</span>`;
  if (outcome.startsWith('Negative')) return `<span class="outcome-tag outcome-negative">${outcome}</span>`;
  if (outcome === 'No Show') return '<span class="outcome-tag outcome-noshow">No Show</span>';
  return `<span class="outcome-tag outcome-pending">${outcome}</span>`;
}

function render() {
  const campaigns = filteredCampaigns();
  const meetings = filteredMeetings();

  // Campaign KPIs
  const totalList = campaigns.reduce((s, d) => s + num(d['List Size']), 0);
  const totalQC = campaigns.reduce((s, d) => s + num(d['Qualified Connects']), 0);
  const totalBooked = campaigns.reduce((s, d) => s + num(d['Booked']), 0);
  const avgBooking = totalList > 0 ? (totalBooked / totalList * 100) : 0;
  const activeCampaigns = campaigns.filter(d => !d['End Date']).length;

  // Meeting KPIs
  const totalDemos = meetings.length;
  const completed = meetings.filter(d => d['Completed'] === 'Yes');
  const closedWon = meetings.filter(d => d['Demo Outcome'] === 'Closed Won').length;
  const positive = meetings.filter(d => (d['Demo Outcome'] || '').startsWith('Positive')).length;
  const negative = meetings.filter(d => (d['Demo Outcome'] || '').startsWith('Negative')).length;
  const noShows = meetings.filter(d => d['Demo Outcome'] === 'No Show').length;
  const pending = meetings.filter(d => !d['Demo Outcome'] && d['Completed'] !== 'Yes').length;
  const showRate = totalDemos > 0 ? (completed.length / totalDemos * 100) : 0;
  const winRate = completed.length > 0 ? (closedWon / completed.length * 100) : 0;

  // Revenue KPIs
  const totalSpend = clientData.reduce((s, d) => s + money(d['Spend']), 0);
  const uniqueClients = [...new Set(clientData.map(d => d['Advertiser']))].length;
  const totalClientCampaigns = clientData.length;

  document.getElementById('content').innerHTML = `
    <!-- ===== GTM CAMPAIGNS SECTION ===== -->
    <div class="section-title">GTM Campaigns</div>
    <hr class="section-divider">

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Campaigns</div>
        <div class="kpi-value">${campaigns.length}</div>
        <div class="kpi-sub">${activeCampaigns} active</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total List Size</div>
        <div class="kpi-value">${totalList.toLocaleString()}</div>
        <div class="kpi-sub">contacts loaded</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Qualified Connects</div>
        <div class="kpi-value">${totalQC}</div>
        <div class="kpi-sub">${totalList > 0 ? (totalQC/totalList*100).toFixed(2) : 0}% qualification rate</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Meetings Booked</div>
        <div class="kpi-value">${totalBooked}</div>
        <div class="kpi-sub">${avgBooking.toFixed(2)}% booking rate</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Lead to Meeting</div>
        <div class="kpi-value">${totalQC > 0 ? (totalBooked/totalQC*100).toFixed(0) : 0}%</div>
        <div class="kpi-sub">conversion rate</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="table-card">
        <h3>Performance by ICP Vertical</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ICP</th><th>List Size</th><th>Qualified</th><th>Booked</th><th>Booking Rate</th></tr></thead>
            <tbody id="table-icp"></tbody>
          </table>
        </div>
      </div>
      <div class="table-card">
        <h3>Performance by GTM Motion</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>GTM Motion</th><th>List Size</th><th>Qualified</th><th>Booked</th><th>Booking Rate</th></tr></thead>
            <tbody id="table-motion"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="table-card">
      <h3>All Campaigns</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>GTM Motion</th>
              <th>Campaign</th>
              <th>ICP</th>
              <th>Master ICP</th>
              <th>Spear Tip</th>
              <th>Start</th>
              <th>Status</th>
              <th>List Size</th>
              <th>Qualified</th>
              <th>Booked</th>
              <th style="text-align:center">Cold Call</th>
              <th style="text-align:center">Email</th>
              <th style="text-align:center">LinkedIn</th>
              <th>Booking Rate</th>
            </tr>
          </thead>
          <tbody>
            ${campaigns.map(d => {
              const motion = d['GTM Motion'] || '';
              const tagClass = motionTagClass(motion);
              const bookingRate = pct(d['Booking Rate']);
              const maxRate = Math.max(...campaignData.map(x => pct(x['Booking Rate'])), 0.01);
              const barW = (bookingRate / maxRate * 100).toFixed(0);
              const status = d['End Date'] ? 'Ended' : 'Active';
              const statusColor = d['End Date'] ? 'var(--text-muted)' : 'var(--green)';
              const icp = d['ICP'] || '';
              const byCh = campaignBookingsByChannel(motion);
              return `<tr>
                <td><span class="tag ${tagClass}">${motion}</span></td>
                <td>${d['Campaign Name'] || ''}</td>
                <td>${icp}</td>
                <td>${d['Master ICP'] || ''}</td>
                <td>${d['Spear Tip'] || ''}</td>
                <td>${d['Start Date'] || ''}</td>
                <td style="color:${statusColor}">${status}</td>
                <td>${num(d['List Size']).toLocaleString()}</td>
                <td>${num(d['Qualified Connects'])}</td>
                <td><strong>${num(d['Booked'])}</strong></td>
                <td style="text-align:center">${byCh.call || '—'}</td>
                <td style="text-align:center">${byCh.email || '—'}</td>
                <td style="text-align:center">${byCh.linkedin || '—'}</td>
                <td>
                  <div class="bar-cell">
                    <div class="mini-bar" style="width:${barW}px"></div>
                    ${bookingRate.toFixed(2)}%
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- ===== BOOKED MEETINGS SECTION ===== -->
    <div class="section-title">Booked Meetings</div>
    <hr class="section-divider">

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Total Demos</div>
        <div class="kpi-value">${totalDemos}</div>
        <div class="kpi-sub">${completed.length} completed</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Closed Won</div>
        <div class="kpi-value green">${closedWon}</div>
        <div class="kpi-sub">${winRate.toFixed(0)}% win rate</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Positive</div>
        <div class="kpi-value" style="color:var(--accent-light)">${positive}</div>
        <div class="kpi-sub">active pipeline</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Negative</div>
        <div class="kpi-value" style="color:#fb923c">${negative}</div>
        <div class="kpi-sub">closed lost</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">No Shows</div>
        <div class="kpi-value red">${noShows}</div>
        <div class="kpi-sub">${totalDemos > 0 ? (noShows/totalDemos*100).toFixed(0) : 0}% no-show rate</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Pending</div>
        <div class="kpi-value">${pending}</div>
        <div class="kpi-sub">upcoming demos</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Show Rate</div>
        <div class="kpi-value">${showRate.toFixed(0)}%</div>
        <div class="kpi-sub">of scheduled demos</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>Demo Outcomes</h3>
        <div class="chart-container"><canvas id="chart-outcomes"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Demos by Attribution Channel</h3>
        <div class="chart-container"><canvas id="chart-attribution"></canvas></div>
      </div>
    </div>

    <div class="table-card">
      <h3>All Booked Meetings</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Contact</th>
              <th>Company</th>
              <th>Demo Date</th>
              <th>Completed</th>
              <th>Outcome</th>
              <th>GTM Source</th>
              <th>Attribution</th>
            </tr>
          </thead>
          <tbody>
            ${meetings.map(d => {
              const source = d['GTM Source'] || '';
              const tagClass = motionTagClass(source);
              return `<tr>
                <td>${d['Contact'] || ''}</td>
                <td><strong>${d['Company'] || ''}</strong></td>
                <td>${d['Demo Date'] || ''}</td>
                <td>${d['Completed'] === 'Yes' ? '<span style="color:var(--green)">Yes</span>' : '<span style="color:var(--text-muted)">No</span>'}</td>
                <td>${outcomeTag(d['Demo Outcome'])}</td>
                <td><span class="tag ${tagClass}">${source}</span></td>
                <td>${d['Demo Attribution'] || ''}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- ===== CLIENT TRACKER SECTION ===== -->
    <div class="section-title">Client Tracker</div>
    <hr class="section-divider">

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Active Clients</div>
        <div class="kpi-value cyan">${uniqueClients}</div>
        <div class="kpi-sub">unique advertisers</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Ad Campaigns</div>
        <div class="kpi-value">${totalClientCampaigns}</div>
        <div class="kpi-sub">total campaigns run</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Revenue</div>
        <div class="kpi-value green">$${totalSpend.toLocaleString()}</div>
        <div class="kpi-sub">ad spend to date</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Avg Campaign Value</div>
        <div class="kpi-value">$${totalClientCampaigns > 0 ? Math.round(totalSpend / totalClientCampaigns).toLocaleString() : 0}</div>
        <div class="kpi-sub">per campaign</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>Revenue by Advertiser</h3>
        <div class="chart-container"><canvas id="chart-revenue"></canvas></div>
      </div>
    </div>

    <div class="table-card">
      <h3>All Client Campaigns</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Advertiser</th>
              <th>Campaign Start</th>
              <th>Campaign End</th>
              <th>Spend</th>
            </tr>
          </thead>
          <tbody>
            ${clientData.map(d => {
              return `<tr>
                <td><strong>${d['Advertiser'] || ''}</strong></td>
                <td>${d['Campaign Start'] || ''}</td>
                <td>${d['Campaign End'] || ''}</td>
                <td style="color:var(--green)">$${money(d['Spend']).toLocaleString()}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  renderCharts(campaigns, meetings);
}

function renderCharts(campaigns, meetings) {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  const colors = ['#6366f1','#34d399','#fbbf24','#f87171','#a78bfa','#38bdf8','#fb923c'];

  const doughnutDefaults = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'right', labels: { color: '#8b8d97', font: { size: 12 }, padding: 16 } }
    }
  };

  const barDefaults = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { labels: { color: '#8b8d97', font: { size: 11 } } }
    },
    scales: {
      x: { ticks: { color: '#8b8d97', font: { size: 11 } }, grid: { color: '#2a2e3a' } },
      y: { ticks: { color: '#8b8d97', font: { size: 11 } }, grid: { color: '#2a2e3a' } }
    }
  };

  // ICP summary table
  const icps = [...new Set(campaigns.map(d => d['ICP']))].filter(Boolean);
  const icpData = icps.map(icp => {
    const rows = campaigns.filter(d => d['ICP'] === icp);
    const ls = rows.reduce((s, d) => s + num(d['List Size']), 0);
    const booked = rows.reduce((s, d) => s + num(d['Booked']), 0);
    const ql = rows.reduce((s, d) => s + num(d['Qualified Connects']), 0);
    return { icp, ls, booked, ql, rate: ls > 0 ? booked / ls * 100 : 0 };
  }).sort((a, b) => b.rate - a.rate);

  const icpTbody = document.getElementById('table-icp');
  if (icpTbody) {
    icpTbody.innerHTML = icpData.map(d => {
      const maxRate = Math.max(...icpData.map(x => x.rate), 0.01);
      const barW = (d.rate / maxRate * 80).toFixed(0);
      return `<tr>
        <td><strong>${d.icp}</strong></td>
        <td>${d.ls.toLocaleString()}</td>
        <td>${d.ql}</td>
        <td><strong>${d.booked}</strong></td>
        <td><div class="bar-cell"><div class="mini-bar" style="width:${barW}px"></div>${d.rate.toFixed(2)}%</div></td>
      </tr>`;
    }).join('');
  }

  // GTM Motion summary table
  const motions = [...new Set(campaigns.map(d => d['GTM Motion']))];
  const motionData = motions.map(m => {
    const rows = campaigns.filter(d => d['GTM Motion'] === m);
    const ls = rows.reduce((s, d) => s + num(d['List Size']), 0);
    const booked = rows.reduce((s, d) => s + num(d['Booked']), 0);
    const ql = rows.reduce((s, d) => s + num(d['Qualified Connects']), 0);
    return { m, ls, booked, ql, rate: ls > 0 ? booked / ls * 100 : 0 };
  }).sort((a, b) => b.rate - a.rate);

  const motionTbody = document.getElementById('table-motion');
  if (motionTbody) {
    motionTbody.innerHTML = motionData.map(d => {
      const tagClass = motionTagClass(d.m);
      const maxRate = Math.max(...motionData.map(x => x.rate), 0.01);
      const barW = (d.rate / maxRate * 80).toFixed(0);
      return `<tr>
        <td><span class="tag ${tagClass}">${d.m}</span></td>
        <td>${d.ls.toLocaleString()}</td>
        <td>${d.ql}</td>
        <td><strong>${d.booked}</strong></td>
        <td><div class="bar-cell"><div class="mini-bar" style="width:${barW}px"></div>${d.rate.toFixed(2)}%</div></td>
      </tr>`;
    }).join('');
  }

  // Demo outcomes doughnut
  const outcomeClosedWon = meetings.filter(d => d['Demo Outcome'] === 'Closed Won').length;
  const outcomePositive = meetings.filter(d => (d['Demo Outcome'] || '').startsWith('Positive')).length;
  const outcomeNegative = meetings.filter(d => (d['Demo Outcome'] || '').startsWith('Negative')).length;
  const outcomeNoShow = meetings.filter(d => d['Demo Outcome'] === 'No Show').length;
  const outcomePending = meetings.filter(d => !d['Demo Outcome']).length;

  charts.outcomes = new Chart(document.getElementById('chart-outcomes'), {
    type: 'doughnut',
    data: {
      labels: ['Closed Won', 'Positive', 'Negative', 'No Show', 'Pending'],
      datasets: [{
        data: [outcomeClosedWon, outcomePositive, outcomeNegative, outcomeNoShow, outcomePending],
        backgroundColor: ['#34d399', '#818cf8', '#fb923c', '#f87171', '#4b5563'],
        borderWidth: 0,
        spacing: 2
      }]
    },
    options: doughnutDefaults
  });

  // Attribution channel bar
  const channels = [...new Set(meetings.map(d => d['Demo Attribution']))].filter(Boolean);
  const channelData = channels.map(ch => ({
    ch,
    count: meetings.filter(d => d['Demo Attribution'] === ch).length
  })).sort((a, b) => b.count - a.count);

  charts.attribution = new Chart(document.getElementById('chart-attribution'), {
    type: 'bar',
    data: {
      labels: channelData.map(d => d.ch),
      datasets: [{
        label: 'Demos',
        data: channelData.map(d => d.count),
        backgroundColor: channelData.map((_, i) => colors[i % colors.length]),
        borderRadius: 6,
        maxBarThickness: 60
      }]
    },
    options: {
      ...barDefaults,
      plugins: { ...barDefaults.plugins, legend: { display: false } },
      indexAxis: 'y'
    }
  });

  // Revenue by advertiser
  const advertisers = [...new Set(clientData.map(d => d['Advertiser']))];
  const revenueData = advertisers.map(a => ({
    name: a,
    total: clientData.filter(d => d['Advertiser'] === a).reduce((s, d) => s + money(d['Spend']), 0),
    campaigns: clientData.filter(d => d['Advertiser'] === a).length
  })).sort((a, b) => b.total - a.total);

  charts.revenue = new Chart(document.getElementById('chart-revenue'), {
    type: 'bar',
    data: {
      labels: revenueData.map(d => d.name),
      datasets: [{
        label: 'Total Spend',
        data: revenueData.map(d => d.total),
        backgroundColor: revenueData.map((_, i) => colors[i % colors.length]),
        borderRadius: 6,
        maxBarThickness: 60
      }]
    },
    options: {
      ...barDefaults,
      plugins: { ...barDefaults.plugins, legend: { display: false } },
      scales: {
        ...barDefaults.scales,
        y: { ...barDefaults.scales.y, ticks: { ...barDefaults.scales.y.ticks, callback: v => '$' + v.toLocaleString() } }
      }
    }
  });
}

loadData();
</script>
</body>
</html>
